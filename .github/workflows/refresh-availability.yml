name: Refresh streaming availability

# Re-checks the oldest 500 stored titles once every 24 hours so streaming links
# and Hindi audio status never go stale.
on:
  schedule:
    - cron: "0 2 * * *" # 02:00 UTC daily
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Call refresh endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.LOVABLE_CRON_SECRET }}
        run: |
          set -euo pipefail
          response=$(curl -sS -w '\n%{http_code}' -X POST \
            "$APP_URL/api/public/hooks/refresh-availability" \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: $CRON_SECRET" \
            -d '{"limit":500}')
          status=$(printf '%s' "$response" | tail -n1)
          printf '%s\n' "$response" | sed '$d'
          if [ "$status" != "200" ]; then
            echo "Refresh failed with HTTP $status"
            exit 1
          fi
